services:
  funasr:
    build:
      context: .
      dockerfile: Dockerfile
    image: funasr-api:local
    ports:
      - "${FUNASR_HOST_PORT:-8000}:8000"
    environment:
      FUNASR_HOST: "0.0.0.0"
      FUNASR_PORT: "8000"
      FUNASR_DEVICE: "${FUNASR_DEVICE:-cpu}"
      FUNASR_MODEL: "${FUNASR_MODEL:-sensevoice}"
      FUNASR_WORKERS: "${FUNASR_WORKERS:-1}"
      FUNASR_DATA_DIR: "/data"
      FUNASR_TOKEN: "${FUNASR_TOKEN:-}"
      MODELSCOPE_CACHE: "/models"
    volumes:
      - funasr-cache:/root/.cache
      - ./data:/data
      - ./models:/models
      - ./server.py:/app/server.py
      - ./entrypoint.sh:/app/entrypoint.sh
    shm_size: "2gb"
    restart: unless-stopped

volumes:
  funasr-cache:
